<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150">
  <defs>
    <clipPath id="barclip">
      <rect x="20" y="20" width="1160" height="36" rx="18"/>
    </clipPath>
  </defs>

  <!-- stacked weight bar -->
  <g clip-path="url(#barclip)">
    <rect x="20"   y="20" width="232" height="36" fill="#23865f"/>
    <rect x="252"  y="20" width="232" height="36" fill="#0f9488"/>
    <rect x="484"  y="20" width="174" height="36" fill="#0284c7"/>
    <rect x="658"  y="20" width="116" height="36" fill="#7c3aed"/>
    <rect x="774"  y="20" width="116" height="36" fill="#db2777"/>
    <rect x="890"  y="20" width="116" height="36" fill="#d97706"/>
    <rect x="1006" y="20" width="116" height="36" fill="#65a30d"/>
    <rect x="1122" y="20" width="58"  height="36" fill="#64748b"/>
  </g>
  <g font-family="Geist, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">
    <text x="136"  y="43">20%</text>
    <text x="368"  y="43">20%</text>
    <text x="571"  y="43">15%</text>
    <text x="716"  y="43">10%</text>
    <text x="832"  y="43">10%</text>
    <text x="948"  y="43">10%</text>
    <text x="1064" y="43">10%</text>
    <text x="1151" y="43">5%</text>
  </g>

  <!-- legend row 1 -->
  <g font-family="Geist, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" fill="#6b7a72">
    <circle cx="46"  cy="88" r="6" fill="#23865f"/><text x="62"  y="94">事实准确性 · 20%</text>
    <circle cx="346" cy="88" r="6" fill="#0f9488"/><text x="362" y="94">证据覆盖 · 20%</text>
    <circle cx="646" cy="88" r="6" fill="#0284c7"/><text x="662" y="94">引用正确性 · 15%</text>
    <circle cx="946" cy="88" r="6" fill="#7c3aed"/><text x="962" y="94">术语准确性 · 10%</text>
  </g>
  <!-- legend row 2 -->
  <g font-family="Geist, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" fill="#6b7a72">
    <circle cx="46"  cy="128" r="6" fill="#db2777"/><text x="62"  y="134">边界表达 · 10%</text>
    <circle cx="346" cy="128" r="6" fill="#d97706"/><text x="362" y="134">任务完成度 · 10%</text>
    <circle cx="646" cy="128" r="6" fill="#65a30d"/><text x="662" y="134">可理解性 · 10%</text>
    <circle cx="946" cy="128" r="6" fill="#64748b"/><text x="962" y="134">安全合规性 · 5%</text>
  </g>
</svg>
