<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1693 929" font-family="ui-monospace, 'Cascadia Code', 'JetBrains Mono', Menlo, Consolas, monospace">
  <defs>
    <!-- scanline beam: transparent -> green -> pale blue -> transparent -->
    <linearGradient id="scanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34c98e" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#34c98e" stop-opacity="0.85"/>
      <stop offset="0.72" stop-color="#9ed06c" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#34c98e" stop-opacity="0"/>
    </linearGradient>
    <!-- horizontal glitch stripes (red-shifted) -->
    <pattern id="noiseH" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="2" fill="#34c98e" opacity="0.22"/>
    </pattern>
    <!-- vertical glitch stripes (blue-shifted) -->
    <pattern id="noiseV" width="7" height="7" patternUnits="userSpaceOnUse">
      <rect width="1" height="7" fill="#9ed06c" opacity="0.1"/>
    </pattern>
    <!-- vignette to keep edges cinematic -->
    <radialGradient id="vignette" cx="0.5" cy="0.46" r="0.75">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.5"/>
    </radialGradient>
  </defs>

  <style>
    .float { animation: 7.5s ease-in-out infinite charaFloat; }
    .scan {
      opacity: 0;
      animation: 6s linear infinite scanSweep;
    }
    .glitch-img {
      animation: 9s step-end infinite glitchShift;
    }
    .noise {
      opacity: 0;
      mix-blend-mode: screen;
      animation: 9s steps(9, end) infinite glitchNoise;
    }
    .tag-caret {
      animation: 1.1s step-end infinite caretBlink;
    }
    .corner { stroke: #9fd6bd; stroke-opacity: 0.5; stroke-width: 2; fill: none; }
    .frame { stroke: #9fd6bd; stroke-opacity: 0.16; stroke-width: 1.5; fill: none; }

    @keyframes charaFloat {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-10px); }
    }
    @keyframes scanSweep {
      0%   { opacity: 0; transform: translateY(80px); }
      5%   { opacity: 0.9; }
      42%  { opacity: 0.8; transform: translateY(780px); }
      48%  { opacity: 0; transform: translateY(800px); }
      100% { opacity: 0; transform: translateY(800px); }
    }
    /* brief RGB-split jitter synced with the noise burst below */
    @keyframes glitchShift {
      0%, 5.5%, 8%, 100% { transform: translate(0, 0); }
      6%   { transform: translate(-7px, 3px); }
      6.7% { transform: translate(6px, -4px); }
      7.4% { transform: translate(-3px, 2px); }
    }
    @keyframes glitchNoise {
      0%   { opacity: 0; }
      5.5% { opacity: 1; }
      6.3% { opacity: 0.35; }
      7%   { opacity: 0.9; }
      7.8% { opacity: 0.5; }
      8%   { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes caretBlink {
      50% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .float, .scan, .noise, .glitch-img, .tag-caret { animation: none; }
      .noise { opacity: 0; }
    }
  </style>

  <!-- base raster -->
  <g class="float glitch-img">
    <image x="0" y="0" width="1693" height="929" xlink:href="data:image/webp;base64,__B64__"/>
  </g>

  <!-- atmosphere: vignette + subtle green edge glow -->
  <rect width="1693" height="929" fill="url(#vignette)"/>
  <rect x="0" y="0" width="1693" height="929" fill="url(#noiseV)" opacity="0.35"/>

  <!-- scanline beam -->
  <rect class="scan" x="120" y="0" width="1453" height="3" fill="url(#scanGrad)"/>

  <!-- glitch noise burst (screen blend, mostly transparent) -->
  <g class="noise">
    <rect x="0" y="0" width="1693" height="929" fill="url(#noiseH)"/>
    <rect x="0" y="0" width="1693" height="929" fill="url(#noiseV)" opacity="0.6"/>
  </g>

  <!-- HUD frame + corner crosses -->
  <rect class="frame" x="26" y="26" width="1641" height="877"/>
  <g class="corner">
    <path d="M26 66 v-40 h40"/>
    <path d="M1647 26 h40 v40" transform="translate(-20,0)"/>
    <path d="M1667 863 v40 h-40"/>
    <path d="M66 903 h-40 v-40"/>
  </g>

  <!-- terminal status tag -->
  <g>
    <rect x="64" y="795" width="330" height="44" fill="#0f1a14" fill-opacity="0.82" stroke="#9fd6bd" stroke-opacity="0.25"/>
    <rect x="64" y="795" width="4" height="44" fill="#34c98e"/>
    <text x="86" y="823" font-size="19" letter-spacing="3.5" fill="#eaf5ee">LIBRARY <tspan fill="#34c98e">//</tspan> READY</text>
    <text class="tag-caret" x="376" y="823" font-size="19" fill="#34c98e">_</text>
  </g>
</svg>
