name: iOS TestFlight

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-upload:
    name: Build and upload to TestFlight
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check iOS signing configuration
        id: signing-config
        env:
          IOS_CERTIFICATE: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          missing=()
          for VAR in IOS_CERTIFICATE IOS_CERTIFICATE_PASSWORD IOS_MOBILE_PROVISION APPLE_API_KEY APPLE_API_KEY_P8 APPLE_API_ISSUER; do
            if [[ -z "${!VAR:-}" ]]; then
              missing+=("$VAR")
            fi
          done
          if [[ -z "${APPLE_TEAM_ID:-}" && -z "${APPLE_SIGNING_IDENTITY:-}" ]]; then
            missing+=("APPLE_TEAM_ID or APPLE_SIGNING_IDENTITY")
          fi

          if ((${#missing[@]} > 0)); then
            echo "iOS TestFlight signing is not configured; missing: ${missing[*]}"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              echo "::error::Manual TestFlight builds require all signing secrets"
            else
              echo "::warning::Skipping automatic TestFlight build because signing secrets are not configured"
            fi
            exit 0
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Verify iOS signing configuration
        if: steps.signing-config.outputs.ready == 'true' || github.event_name == 'workflow_dispatch'
        env:
          IOS_CERTIFICATE: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          for VAR in IOS_CERTIFICATE IOS_CERTIFICATE_PASSWORD IOS_MOBILE_PROVISION APPLE_API_KEY APPLE_API_KEY_P8 APPLE_API_ISSUER; do
            if [[ -z "${!VAR:-}" ]]; then
              echo "::error::Missing secret for ${VAR}; cannot sign or upload a TestFlight build"
              exit 1
            fi
          done

      - name: Setup pnpm
        if: steps.signing-config.outputs.ready == 'true'
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        if: steps.signing-config.outputs.ready == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        if: steps.signing-config.outputs.ready == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install frontend dependencies
        if: steps.signing-config.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: iOS release preflight
        if: steps.signing-config.outputs.ready == 'true'
        run: pnpm ios:release:check

      - name: Resolve Apple development team
        if: steps.signing-config.outputs.ready == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          TEAM="${APPLE_TEAM_ID:-}"
          if [[ -z "$TEAM" && "$APPLE_SIGNING_IDENTITY" =~ \(([A-Z0-9]{10})\)$ ]]; then
            TEAM="${BASH_REMATCH[1]}"
            echo "Derived team from APPLE_SIGNING_IDENTITY"
          fi
          if [[ -z "$TEAM" ]]; then
            echo "::error::Cannot resolve team ID; set APPLE_TEAM_ID or APPLE_SIGNING_IDENTITY"
            exit 1
          fi
          echo "APPLE_DEVELOPMENT_TEAM=${TEAM}" >> "$GITHUB_ENV"

      # The export step signs with this key, so write it before the build
      # rather than just before the upload.
      - name: Write App Store Connect API key
        if: steps.signing-config.outputs.ready == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          KEY_PATH="${KEY_DIR}/AuthKey_${APPLE_API_KEY}.p8"
          if [[ "$APPLE_API_KEY_P8" == -----BEGIN* ]]; then
            printf '%s\n' "$APPLE_API_KEY_P8" > "$KEY_PATH"
          else
            # Accept base64-encoded PEM (avoids multiline secret edge cases)
            echo "$APPLE_API_KEY_P8" | base64 --decode > "$KEY_PATH"
          fi
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=${KEY_PATH}" >> "$GITHUB_ENV"

      # Tauri imports the certificate into a keychain it deletes when the CLI
      # exits, so the separate `xcodebuild -exportArchive` below would fail with
      # `No signing certificate "iOS Distribution" found`. Keep our own keychain
      # alive for the whole job instead.
      - name: Import distribution certificate into a job keychain
        if: steps.signing-config.outputs.ready == 'true'
        env:
          IOS_CERTIFICATE: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/agentero-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "::add-mask::${KEYCHAIN_PASSWORD}"
          CERT_PATH="$RUNNER_TEMP/distribution.p12"
          echo "$IOS_CERTIFICATE" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Long timeout so the keychain stays unlocked across the whole build.
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -f pkcs12 -A
          # Without this, codesign prompts for keychain access and fails on CI.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT_PATH"

          security find-identity -v -p codesigning "$KEYCHAIN"
          echo "SIGNING_KEYCHAIN=${KEYCHAIN}" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN_PASSWORD=${KEYCHAIN_PASSWORD}" >> "$GITHUB_ENV"

      - name: Install and validate App Store provisioning profile
        if: steps.signing-config.outputs.ready == 'true'
        env:
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
        run: |
          set -euo pipefail
          # Xcode 16 resolves profiles from UserData; keep the legacy
          # MobileDevice copy so older xcodebuild versions find it too.
          XCODE_DIR="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          LEGACY_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_PATH="${XCODE_DIR}/agentero-app-store.mobileprovision"
          DECODED_PLIST="${RUNNER_TEMP}/agentero-profile.plist"
          mkdir -p "$XCODE_DIR" "$LEGACY_DIR"

          echo "$IOS_MOBILE_PROVISION" | base64 --decode > "$PROFILE_PATH"
          cp "$PROFILE_PATH" "${LEGACY_DIR}/agentero-app-store.mobileprovision"
          security cms -D -i "$PROFILE_PATH" > "$DECODED_PLIST"

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$DECODED_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$DECODED_PLIST")
          APP_IDENTIFIER=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$DECODED_PLIST")
          EXPECTED_IDENTIFIER="${APPLE_DEVELOPMENT_TEAM}.com.poco-ai.agentero"

          if [[ "$APP_IDENTIFIER" != "$EXPECTED_IDENTIFIER" ]]; then
            echo "::error::Provisioning profile application identifier is ${APP_IDENTIFIER}, expected ${EXPECTED_IDENTIFIER}"
            exit 1
          fi

          echo "Installed provisioning profile: ${PROFILE_NAME} (${PROFILE_UUID})"
          echo "PROVISIONING_PROFILE_SPECIFIER=${PROFILE_UUID}" >> "$GITHUB_ENV"

      - name: Build iOS archive
        if: steps.signing-config.outputs.ready == 'true'
        env:
          # macos-latest runners have 7GB RAM, so Node's default ~2GB heap
          # limit is not enough for `vite build` on this bundle.
          NODE_OPTIONS: --max-old-space-size=6144
          # Tauri CLI imports the certificate into a temp keychain and installs
          # the provisioning profile when these are present on CI.
          IOS_CERTIFICATE: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          # Two-digit year keeps the build number within u32 (see ios-testflight.md).
          BUILD_NUMBER="$(date +%y%m%d%H%M)"
          echo "Build number: ${BUILD_NUMBER}"
          pnpm tauri ios build \
            --config src-tauri/tauri.ios.conf.json \
            --target aarch64 \
            --build-number "${BUILD_NUMBER}" \
            --export-method app-store-connect

      # Tauri's auto-generated ExportOptions.plist omits `provisioningProfiles`,
      # so its export skips IDEDistributionEmbedProfileStep and altool rejects
      # the IPA with error 90174. Re-export the archive with a plist that maps
      # the bundle id to the profile UUID. Keep in sync with
      # scripts/ios-testflight.sh, which does the same for local releases.
      - name: Re-export IPA with embedded provisioning profile
        if: steps.signing-config.outputs.ready == 'true'
        run: |
          set -euo pipefail
          ARCHIVE="src-tauri/gen/apple/build/agentero_iOS.xcarchive"
          EXPORT_PLIST="src-tauri/gen/apple/build/ExportOptions.fixed.plist"
          if [[ ! -d "$ARCHIVE" ]]; then
            echo "::error::Archive not found at ${ARCHIVE}"
            exit 1
          fi

          # Tauri's own temp keychain is gone by now, and it may have rewritten
          # the search list, so re-assert ours before signing the export.
          security list-keychains -d user -s "$SIGNING_KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security unlock-keychain -p "$SIGNING_KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          security find-identity -v -p codesigning "$SIGNING_KEYCHAIN"

          cat > "$EXPORT_PLIST" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>destination</key>
          	<string>export</string>
          	<key>method</key>
          	<string>app-store-connect</string>
          	<key>signingStyle</key>
          	<string>manual</string>
          	<key>signingCertificate</key>
          	<string>Apple Distribution</string>
          	<key>teamID</key>
          	<string>${APPLE_DEVELOPMENT_TEAM}</string>
          	<key>uploadSymbols</key>
          	<true/>
          	<key>stripSwiftSymbols</key>
          	<true/>
          	<key>provisioningProfiles</key>
          	<dict>
          		<key>com.poco-ai.agentero</key>
          		<string>${PROVISIONING_PROFILE_SPECIFIER}</string>
          	</dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportPath "src-tauri/gen/apple/build/arm64" \
            -exportOptionsPlist "$EXPORT_PLIST" >/dev/null

          IPA="src-tauri/gen/apple/build/arm64/Agentero.ipa"
          if ! unzip -l "$IPA" 2>/dev/null | grep -q "embedded.mobileprovision"; then
            echo "::error::embedded.mobileprovision is missing from ${IPA}; refusing to upload."
            exit 1
          fi
          echo "Verified embedded.mobileprovision in ${IPA}"

      - name: Upload to App Store Connect
        if: steps.signing-config.outputs.ready == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          xcrun altool --upload-app \
            -f "src-tauri/gen/apple/build/arm64/Agentero.ipa" -t ios \
            --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER"
