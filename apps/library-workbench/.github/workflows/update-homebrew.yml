name: Update Homebrew Tap

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sync"
        required: true

jobs:
  update-tap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap repository
        uses: actions/checkout@v5
        with:
          repository: poco-ai/homebrew-agentero
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Fetch release assets
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          mkdir -p tmp
          cd tmp

          gh release view "$TAG" \
            --repo "${{ github.repository }}" \
            --json assets \
            --jq '.assets[].name' > assets.txt

          echo "Release assets:"
          cat assets.txt

      - name: Update CLI formula
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.fetch.outputs.version }}"
          cd tmp

          download_and_hash() {
            local asset="$1"
            curl -sL "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/${asset}" -o "$asset"
            sha256sum "$asset" | cut -d' ' -f1
          }

          update_checksum() {
            local file="$1"
            local asset="$2"
            local sha="$3"
            VERSION="$VERSION" ruby - "$file" "$asset" "$sha" <<'RUBY'
          file, asset, sha = ARGV
          lines = File.readlines(file)
          template_asset = asset.sub(ENV.fetch("VERSION"), '#{version}')
          url_index = lines.index { |line| line.include?(template_asset) }
          abort "Missing URL for #{asset} in #{file}" unless url_index

          checksum_index = [url_index - 1, url_index + 1].find do |index|
            index >= 0 && index < lines.length && lines[index].match?(/^\s*sha256\s+"[^"]+"/)
          end
          abort "Missing checksum adjacent to #{asset} in #{file}" unless checksum_index

          indent = lines[checksum_index][/^\s*/]
          lines[checksum_index] = "#{indent}sha256 \"#{sha}\"\n"
          File.write(file, lines.join)
          RUBY
          }

          expected_assets=(
            "agentero-cli-${VERSION}-aarch64-apple-darwin.tar.gz"
            "agentero-cli-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
            "agentero-cli-${VERSION}-aarch64-unknown-linux-gnu.tar.gz"
          )
          for asset in "${expected_assets[@]}"; do
            grep -Fxq "$asset" assets.txt || {
              echo "::error::Missing required CLI asset: $asset"
              exit 1
            }
          done

          while IFS= read -r asset; do
            case "$asset" in
              agentero-cli-${VERSION}-aarch64-apple-darwin.tar.gz)
                sha=$(download_and_hash "$asset")
                update_checksum ../Formula/agentero.rb "$asset" "$sha"
                ;;
              agentero-cli-${VERSION}-x86_64-unknown-linux-gnu.tar.gz)
                sha=$(download_and_hash "$asset")
                update_checksum ../Formula/agentero.rb "$asset" "$sha"
                ;;
              agentero-cli-${VERSION}-aarch64-unknown-linux-gnu.tar.gz)
                sha=$(download_and_hash "$asset")
                update_checksum ../Formula/agentero.rb "$asset" "$sha"
                ;;
            esac
          done < assets.txt

          sed -i -E "s/version \"[^\"]*\"/version \"${VERSION}\"/" ../Formula/agentero.rb

      - name: Update Cask
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.fetch.outputs.version }}"
          cd tmp

          has_aarch64=0

          update_checksum() {
            local file="$1"
            local asset="$2"
            local sha="$3"
            VERSION="$VERSION" ruby - "$file" "$asset" "$sha" <<'RUBY'
          file, asset, sha = ARGV
          lines = File.readlines(file)
          template_asset = asset.sub(ENV.fetch("VERSION"), '#{version}')
          url_index = lines.index { |line| line.include?(template_asset) }
          abort "Missing URL for #{asset} in #{file}" unless url_index

          checksum_index = [url_index - 1, url_index + 1].find do |index|
            index >= 0 && index < lines.length && lines[index].match?(/^\s*sha256\s+"[^"]+"/)
          end
          abort "Missing checksum adjacent to #{asset} in #{file}" unless checksum_index

          indent = lines[checksum_index][/^\s*/]
          lines[checksum_index] = "#{indent}sha256 \"#{sha}\"\n"
          File.write(file, lines.join)
          RUBY
          }

          expected_assets=(
            "Agentero_${VERSION}_aarch64.dmg"
            "Agentero_${VERSION}_aarch64.AppImage"
            "Agentero_${VERSION}_amd64.AppImage"
          )
          for asset in "${expected_assets[@]}"; do
            grep -Fxq "$asset" assets.txt || {
              echo "::error::Missing required cask asset: $asset"
              exit 1
            }
          done

          while IFS= read -r asset; do
            case "$asset" in
              Agentero_${VERSION}_aarch64.dmg)
                curl -sL "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/${asset}" -o "$asset"
                sha=$(sha256sum "$asset" | cut -d' ' -f1)
                update_checksum ../Casks/agentero.rb "$asset" "$sha"
                has_aarch64=1
                ;;
              Agentero_${VERSION}_aarch64.AppImage)
                curl -sL "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/${asset}" -o "$asset"
                sha=$(sha256sum "$asset" | cut -d' ' -f1)
                update_checksum ../Casks/agentero.rb "$asset" "$sha"
                ;;
              Agentero_${VERSION}_amd64.AppImage)
                curl -sL "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/${asset}" -o "$asset"
                sha=$(sha256sum "$asset" | cut -d' ' -f1)
                update_checksum ../Casks/agentero.rb "$asset" "$sha"
                ;;
            esac
          done < assets.txt

          sed -i -E "s/version \"[^\"]*\"/version \"${VERSION}\"/" ../Casks/agentero.rb

          if [ "$has_aarch64" -eq 0 ]; then
            echo "::error::No macOS ARM64 DMG was updated."
            exit 1
          fi

      - name: Commit and push tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/agentero.rb Casks/agentero.rb
          if git diff --cached --quiet; then
            echo "No changes to tap."
            exit 0
          fi
          git commit -m "chore: bump agentero to v${{ steps.fetch.outputs.version }}"
          git push
