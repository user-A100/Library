      <path d="M0 -14 C -20 -34, -26 -66, -14 -88 C -6 -96, 6 -96, 14 -88 C 26 -66, 20 -34, 0 -14 Z"/>
      <path d="M0 -14 C -20 -34, -26 -66, -14 -88 C -6 -96, 6 -96, 14 -88 C 26 -66, 20 -34, 0 -14 Z" transform="rotate(45)"/>
      <path d="M0 -14 C -20 -34, -26 -66, -14 -88 C -6 -96, 6 -96, 14 -88 C 26 -66, 20 -34, 0 -14 Z" transform="rotate(90)"/>
      <path d="M0 -14 C -20 -34, -26 -66, -14 -88 C -6 -96, 6 -96, 14 -88 C 26 -66, 20 -34, 0 -14 Z" transform="rotate(135)"/>
      <path d="M0 -14 C -20 -34, -26 -66, -14 -88 C -6 -96, 6 -96, 14 -88 C 26 -66, 20 -34, 0 -14 Z" transform="rotate(180)"/>
      <path d="M0 -14 C -20 -34, -26 -66, -14 -88 C -6 -96, 6 -96, 14 -88 C 26 -66, 20 -34, 0 -14 Z" transform="rotate(225)"/>
      <path d="M0 -14 C -20 -34, -26 -66, -14 -88 C -6 -96, 6 -96, 14 -88 C 26 -66, 20 -34, 0 -14 Z" transform="rotate(270)"/>
      <path d="M0 -14 C -20 -34, -26 -66, -14 -88 C -6 -96, 6 -96, 14 -88 C 26 -66, 20 -34, 0 -14 Z" transform="rotate(315)"/>
    </g>
    <circle r="16" fill="url(#centerGold)"/>
    <g fill="#b8862b">
      <circle cx="-6" cy="-4" r="2"/><circle cx="5" cy="-6" r="2"/><circle cx="7" cy="4" r="2"/>
      <circle cx="-3" cy="7" r="2"/><circle cx="0" cy="0" r="2"/>
    </g>
  </g>

  <!-- pink cosmos, right -->
  <g transform="translate(420 336)">
    <g fill="url(#petalPink)">
      <path d="M0 -12 C -17 -28, -22 -56, -12 -74 C -5 -81, 5 -81, 12 -74 C 22 -56, 17 -28, 0 -12 Z"/>
      <path d="M0 -12 C -17 -28, -22 -56, -12 -74 C -5 -81, 5 -81, 12 -74 C 22 -56, 17 -28, 0 -12 Z" transform="rotate(45)"/>
      <path d="M0 -12 C -17 -28, -22 -56, -12 -74 C -5 -81, 5 -81, 12 -74 C 22 -56, 17 -28, 0 -12 Z" transform="rotate(90)"/>
      <path d="M0 -12 C -17 -28, -22 -56, -12 -74 C -5 -81, 5 -81, 12 -74 C 22 -56, 17 -28, 0 -12 Z" transform="rotate(135)"/>
      <path d="M0 -12 C -17 -28, -22 -56, -12 -74 C -5 -81, 5 -81, 12 -74 C 22 -56, 17 -28, 0 -12 Z" transform="rotate(180)"/>
      <path d="M0 -12 C -17 -28, -22 -56, -12 -74 C -5 -81, 5 -81, 12 -74 C 22 -56, 17 -28, 0 -12 Z" transform="rotate(225)"/>
      <path d="M0 -12 C -17 -28, -22 -56, -12 -74 C -5 -81, 5 -81, 12 -74 C 22 -56, 17 -28, 0 -12 Z" transform="rotate(270)"/>
      <path d="M0 -12 C -17 -28, -22 -56, -12 -74 C -5 -81, 5 -81, 12 -74 C 22 -56, 17 -28, 0 -12 Z" transform="rotate(315)"/>
