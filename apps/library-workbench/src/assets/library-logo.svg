<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    Library app icon — spring bouquet.
    Vector interpretation of the brand artwork: lavender cosmos, two yellow
    roses, pink cosmos, blue forget-me-nots, pink buds and sprays over green
    stems and foliage. Transparent background; reads from 32px tray to 512px.
  -->
  <defs>
    <radialGradient id="petalLavender" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#e6e0fb"/>
      <stop offset="55%" stop-color="#c9bcf2"/>
      <stop offset="100%" stop-color="#a98fe0"/>
    </radialGradient>
    <radialGradient id="petalPink" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#fde3ea"/>
      <stop offset="55%" stop-color="#f8bccb"/>
      <stop offset="100%" stop-color="#ee93ab"/>
    </radialGradient>
    <radialGradient id="petalRose" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#fdf3bf"/>
      <stop offset="60%" stop-color="#f9e58a"/>
      <stop offset="100%" stop-color="#eed069"/>
    </radialGradient>
    <radialGradient id="leaf" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#7fb254"/>
      <stop offset="100%" stop-color="#4d7d33"/>
    </radialGradient>
    <radialGradient id="stem" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#6d9c48"/>
      <stop offset="100%" stop-color="#527f36"/>
    </radialGradient>
    <radialGradient id="centerGold" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#f2c14e"/>
      <stop offset="100%" stop-color="#d99a2b"/>
    </radialGradient>
  </defs>

  <!-- stems -->
  <g stroke="url(#stem)" stroke-linecap="round" fill="none">
    <path d="M296 468 C 270 400, 240 320, 248 190" stroke-width="9"/>
    <path d="M300 468 C 310 400, 330 330, 416 300" stroke-width="8"/>
    <path d="M292 470 C 260 430, 220 380, 196 320" stroke-width="8"/>
    <path d="M304 470 C 330 430, 360 380, 366 320" stroke-width="7"/>
    <path d="M298 468 C 288 420, 268 360, 262 300" stroke-width="7"/>
    <path d="M290 468 C 240 400, 160 320, 118 250" stroke-width="8"/>
    <path d="M294 466 C 270 380, 190 200, 140 108" stroke-width="7"/>
    <path d="M296 466 C 300 360, 350 200, 396 130" stroke-width="7"/>
    <path d="M300 468 C 320 420, 350 340, 352 290" stroke-width="6"/>
  </g>

  <!-- foliage -->
  <g fill="url(#leaf)">
    <path d="M248 330 C 200 320, 170 340, 150 380 C 200 385, 235 365, 248 330 Z"/>
    <path d="M262 360 C 300 340, 340 350, 365 385 C 320 395, 285 385, 262 360 Z"/>
    <path d="M282 410 C 240 405, 210 425, 196 460 C 245 462, 272 442, 282 410 Z"/>
    <path d="M300 400 C 340 390, 375 405, 392 440 C 348 448, 318 432, 300 400 Z"/>
    <path d="M200 260 C 160 250, 130 262, 108 292 C 150 300, 182 288, 200 260 Z"/>
    <path d="M352 330 C 390 318, 425 328, 448 356 C 408 366, 375 358, 352 330 Z"/>
    <path d="M150 180 C 118 170, 92 178, 72 202 C 106 212, 134 206, 150 180 Z"/>
    <path d="M400 220 C 432 208, 462 214, 484 238 C 450 250, 420 246, 400 220 Z"/>
  </g>

  <!-- top-left buds on tall stems -->
  <g>
    <path d="M136 118 C 128 92, 132 74, 146 62 C 158 76, 158 96, 148 116 C 144 122, 139 122, 136 118 Z" fill="url(#petalPink)"/>
    <path d="M118 152 C 108 130, 110 112, 122 100 C 134 112, 136 132, 128 150 C 124 156, 120 156, 118 152 Z" fill="url(#petalPink)"/>
  </g>

  <!-- top-right pink buds -->
  <g>
    <path d="M400 128 C 386 108, 384 88, 396 72 C 412 82, 420 102, 414 124 C 411 132, 405 133, 400 128 Z" fill="url(#petalPink)"/>
    <path d="M436 158 C 426 142, 426 126, 436 114 C 449 123, 454 140, 448 156 C 445 162, 440 163, 436 158 Z" fill="url(#petalPink)"/>
  </g>

  <!-- pink spray clusters (small filler blooms) -->
  <g fill="#f4b8c6">
    <g>
      <circle cx="118" cy="212" r="7"/><circle cx="136" cy="200" r="6"/><circle cx="128" cy="224" r="6"/>
      <circle cx="146" cy="216" r="5"/><circle cx="110" cy="232" r="5"/>
    </g>
    <g>
      <circle cx="248" cy="248" r="6"/><circle cx="262" cy="238" r="5"/><circle cx="256" cy="258" r="5"/>
      <circle cx="236" cy="238" r="5"/>
    </g>
    <g>
      <circle cx="176" cy="342" r="6"/><circle cx="190" cy="332" r="5"/><circle cx="184" cy="352" r="5"/>
    </g>
  </g>

