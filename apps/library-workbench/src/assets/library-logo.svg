    <g fill="#b8862b">
      <circle cx="-5" cy="-3" r="1.8"/><circle cx="4" cy="-5" r="1.8"/><circle cx="6" cy="3" r="1.8"/>
      <circle cx="-2" cy="6" r="1.8"/>
    </g>
  </g>

  <!-- yellow rose, middle left -->
  <g transform="translate(206 292)">
    <circle r="52" fill="url(#petalRose)"/>
    <g fill="none" stroke="#e3c25c" stroke-linecap="round">
      <path d="M-46 -12 A 48 48 0 0 1 44 -22" stroke-width="7"/>
      <path d="M-38 26 A 46 46 0 0 1 -46 -8" stroke-width="7"/>
      <path d="M40 30 A 46 46 0 0 1 -34 40" stroke-width="7"/>
      <path d="M-28 -22 A 34 34 0 0 1 30 -14" stroke-width="6"/>
      <path d="M-24 20 A 32 32 0 0 1 -26 -14" stroke-width="6"/>
      <path d="M26 20 A 32 32 0 0 1 -20 28" stroke-width="6"/>
      <path d="M-12 -12 A 20 20 0 0 1 16 -6" stroke-width="5"/>
      <path d="M14 12 A 18 18 0 0 1 -12 14" stroke-width="5"/>
      <path d="M-6 2 A 10 10 0 0 1 8 0" stroke-width="4"/>
    </g>
  </g>

  <!-- yellow rose, lower center (larger) -->
  <g transform="translate(268 418)">
    <circle r="62" fill="url(#petalRose)"/>
    <g fill="none" stroke="#e3c25c" stroke-linecap="round">
      <path d="M-55 -14 A 57 57 0 0 1 52 -26" stroke-width="8"/>
      <path d="M-45 31 A 55 55 0 0 1 -55 -10" stroke-width="8"/>
      <path d="M48 36 A 55 55 0 0 1 -40 48" stroke-width="8"/>
      <path d="M-33 -26 A 41 41 0 0 1 36 -17" stroke-width="7"/>
      <path d="M-29 24 A 38 38 0 0 1 -31 -17" stroke-width="7"/>
      <path d="M31 24 A 38 38 0 0 1 -24 34" stroke-width="7"/>
      <path d="M-14 -15 A 24 24 0 0 1 19 -7" stroke-width="6"/>
      <path d="M17 15 A 22 22 0 0 1 -14 17" stroke-width="6"/>
      <path d="M-7 2 A 12 12 0 0 1 10 0" stroke-width="5"/>
    </g>
  </g>
</svg>
