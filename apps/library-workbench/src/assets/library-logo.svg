        <ellipse cx="0" cy="-11" rx="7" ry="9"/><ellipse cx="10" cy="-4" rx="7" ry="9"/>
        <ellipse cx="6" cy="9" rx="7" ry="9"/><ellipse cx="-6" cy="9" rx="7" ry="9"/>
        <ellipse cx="-10" cy="-4" rx="7" ry="9"/>
      </g>
      <circle r="4" fill="#f2c14e"/>
    </g>
    <g transform="translate(384 250) scale(0.85)">
      <g fill="#9cc0ee">
        <ellipse cx="0" cy="-11" rx="7" ry="9"/><ellipse cx="10" cy="-4" rx="7" ry="9"/>
        <ellipse cx="6" cy="9" rx="7" ry="9"/><ellipse cx="-6" cy="9" rx="7" ry="9"/>
        <ellipse cx="-10" cy="-4" rx="7" ry="9"/>
      </g>
      <circle r="4" fill="#f2c14e"/>
    </g>
    <g transform="translate(372 296) scale(0.75)">
      <g fill="#8fb4e8">
        <ellipse cx="0" cy="-11" rx="7" ry="9"/><ellipse cx="10" cy="-4" rx="7" ry="9"/>
        <ellipse cx="6" cy="9" rx="7" ry="9"/><ellipse cx="-6" cy="9" rx="7" ry="9"/>
        <ellipse cx="-10" cy="-4" rx="7" ry="9"/>
      </g>
      <circle r="4" fill="#f2c14e"/>
    </g>
