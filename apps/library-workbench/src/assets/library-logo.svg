  </g>
  <g transform="translate(158 352) scale(0.8)">
    <g fill="url(#petalLavender)" stroke="#9a7fd4" stroke-width="1">
      <ellipse cx="0" cy="-26" rx="12" ry="24"/>
      <ellipse cx="20" cy="-10" rx="12" ry="24" transform="rotate(60 20 -10)"/>
      <ellipse cx="14" cy="18" rx="12" ry="24" transform="rotate(120 14 18)"/>
      <ellipse cx="-14" cy="18" rx="12" ry="24" transform="rotate(60 -14 18)"/>
