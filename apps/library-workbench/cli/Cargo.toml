[package]
name = "library-cli"
version = "0.9.4"
edition = "2021"
description = "Headless Library CLI for Vault / Catalog (no BYOA)"
authors = ["you"]
license = "MIT"
publish = false

# Binary file is `library-cli` so it does not collide with the desktop GUI
# binary (`library` from the `library` package) in the shared target dir.
# User-facing PATH install still exposes the command as `library` via shim.
[[bin]]
name = "library-cli"
path = "src/main.rs"

[dependencies]
library_lib = { path = "../src-tauri", package = "library", default-features = false }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
dirs = "6"
toml = "0.8"
# Interactive prompts (TTY only; skipped under --json / non-TTY)
inquire = "0.7"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
serde_json = "1"
