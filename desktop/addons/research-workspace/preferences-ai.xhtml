<vbox id="research-workspace-ai-root" class="research-preferences main-section">
	<html:section class="research-preferences-intro">
		<html:div class="intro-copy"><html:span class="intro-eyebrow">LIBRARY / AI</html:span><html:h1>AI 服务</html:h1><html:p>管理多套模型接口配置（OpenAI 兼容），保存后即可在 AI 面板中随时切换当前配置。</html:p></html:div>
		<html:div class="ai-prefs-actions">
			<html:button type="button" id="ai-import">导入配置…</html:button>
			<html:button type="button" id="ai-export">导出配置…</html:button>
			<html:button type="button" id="ai-add" class="ai-primary">＋ 新增配置</html:button>
		</html:div>
	</html:section>
	<html:section class="ai-prefs-body">
		<html:div class="ai-prefs-list" id="ai-profile-list" role="listbox" aria-label="配置列表"></html:div>
		<html:div class="ai-prefs-detail">
			<html:div class="ai-prefs-grid">
				<html:label>名称<html:input type="text" id="ai-name" placeholder="例如：DeepSeek 官方"/></html:label>
				<html:label>接口预设<html:select id="ai-preset"></html:select></html:label>
				<html:label class="ai-wide">Base URL<html:input type="text" id="ai-baseurl" spellcheck="false" placeholder="https://api.example.com/v1"/></html:label>
				<html:label class="ai-wide">API Key<html:input type="password" id="ai-key" spellcheck="false"/></html:label>
				<html:label class="ai-wide">默认模型<html:input type="text" id="ai-model" spellcheck="false" list="ai-model-options" placeholder="抓取后可从列表选择"/><html:datalist id="ai-model-options"></html:datalist></html:label>
			</html:div>
			<html:div class="ai-prefs-tools">
				<html:button type="button" id="ai-test">测试连接</html:button>
				<html:button type="button" id="ai-fetch">抓取模型列表</html:button>
				<html:span id="ai-status" role="status"></html:span>
			</html:div>
			<html:div class="ai-prefs-savebar">
				<html:button type="button" id="ai-save" class="ai-primary">保存配置</html:button>
				<html:button type="button" id="ai-activate">设为当前</html:button>
				<html:button type="button" id="ai-delete" class="ai-danger">删除</html:button>
			</html:div>
			<html:p class="ai-prefs-note">导出的 JSON 包含 API Key，请妥善保管；导入时同名配置会新建副本，不会覆盖。</html:p>
		</html:div>
	</html:section>
</vbox>
