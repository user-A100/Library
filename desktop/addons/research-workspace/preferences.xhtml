<vbox id="research-workspace-preferences-root" class="research-preferences main-section">
	<html:section class="research-preferences-intro">
		<html:div class="intro-copy"><html:span class="intro-eyebrow">LIBRARY / LOOKS</html:span><html:h1>皮肤</html:h1><html:p>直接在窗口上调色。拖动光点，Library 会同步变化。</html:p></html:div>
		<html:button type="button" id="theme-reset" class="reset-button">恢复默认</html:button>
	</html:section>
	<html:section class="theme-studio" aria-label="Library 外观实时预览">
		<html:div id="theme-canvas" class="theme-canvas" aria-label="主题渐变编辑器">
			<html:div class="preview-window" aria-hidden="true">
				<html:aside class="preview-rail"><html:span class="preview-logo">L</html:span><html:span class="rail-glyph active">▥</html:span><html:span class="rail-glyph">✎</html:span><html:span class="rail-glyph">⌕</html:span></html:aside>
				<html:aside class="preview-library">
					<html:div class="preview-title"><html:strong>Library</html:strong><html:small>研究文库</html:small></html:div><html:div class="preview-search">⌕&#160;&#160;搜索文献</html:div><html:div class="preview-section-label">文库</html:div>
					<html:div class="preview-nav active"><html:span>▥&#160;&#160;全部条目</html:span><html:small>24</html:small></html:div><html:div class="preview-nav"><html:span>▤&#160;&#160;最近添加</html:span><html:small>6</html:small></html:div><html:div class="preview-section-label project">项目</html:div><html:div class="preview-nav"><html:span>□&#160;&#160;论文助手</html:span><html:small>8</html:small></html:div>
				</html:aside>
				<html:main class="preview-content"><html:header><html:span class="preview-dots">•••</html:span><html:strong>开放式场景 AI 应用</html:strong><html:span class="preview-actions">⌕&#160;&#160;⋯</html:span></html:header><html:div class="preview-paper"><html:span class="paper-kicker">RESEARCH NOTE · 2026</html:span><html:h3>论文阅读与知识工作流</html:h3><html:p>让文献、批注和思考保持在同一个连续空间里。</html:p><html:div class="paper-line wide"/><html:div class="paper-line"/><html:div class="paper-highlight"/><html:div class="paper-line short"/></html:div></html:main>
			</html:div>
			<html:div class="appearance-switch floating-control" role="group" aria-label="明暗模式" data-theme-control="true"><html:button type="button" data-appearance="2">自动</html:button><html:button type="button" data-appearance="1">浅色</html:button><html:button type="button" data-appearance="0">深色</html:button></html:div>
			<html:button type="button" id="theme-algorithm" class="theme-algorithm floating-control" aria-pressed="false" data-theme-control="true"><html:span class="algorithm-icon">✦</html:span><html:span><html:strong id="theme-algorithm-title">自由渐变</html:strong><html:small id="theme-algorithm-description">拖动光点</html:small></html:span></html:button>
			<html:div class="theme-editor-tools floating-control" data-theme-control="true"><html:button type="button" id="theme-add" aria-label="添加颜色" title="添加颜色">＋</html:button><html:button type="button" id="theme-remove" aria-label="移除当前颜色" title="移除当前颜色">−</html:button><html:label title="编辑当前颜色"><html:input type="color" id="theme-color" aria-label="当前颜色" value="#72e3a6"/></html:label></html:div>
		</html:div>
	</html:section>
	<html:section class="palette-panel"><html:div><html:span class="control-label">配色</html:span><html:small>选择起点，再在上方自由调整</html:small></html:div><html:div class="theme-presets" aria-label="配色起点"><html:button type="button" data-preset="#72e3a6,#83d9d4,#f1e9c9" aria-label="Zen Mint" title="Zen Mint" style="--preset:linear-gradient(135deg,#72e3a6,#83d9d4,#f1e9c9)"/><html:button type="button" data-preset="#82c995,#b8d59d,#e9dfb6" aria-label="Moss" title="Moss" style="--preset:linear-gradient(135deg,#82c995,#b8d59d,#e9dfb6)"/><html:button type="button" data-preset="#ffad91,#f7cf86,#ddd3ee" aria-label="Dawn" title="Dawn" style="--preset:linear-gradient(135deg,#ffad91,#f7cf86,#ddd3ee)"/><html:button type="button" data-preset="#9aa9f5,#c0a7e8,#e8d4e8" aria-label="Iris" title="Iris" style="--preset:linear-gradient(135deg,#9aa9f5,#c0a7e8,#e8d4e8)"/><html:button type="button" data-preset="#5bbbd6,#78d0bd,#c8e4cf" aria-label="Ocean" title="Ocean" style="--preset:linear-gradient(135deg,#5bbbd6,#78d0bd,#c8e4cf)"/><html:button type="button" data-preset="#495553,#697b72,#aeb8a4" aria-label="Graphite" title="Graphite" style="--preset:linear-gradient(135deg,#495553,#697b72,#aeb8a4)"/></html:div></html:section>
	<html:section class="theme-sliders"><html:label class="theme-range"><html:span><html:span><html:strong>色彩</html:strong><html:small>渐变的存在感</html:small></html:span><html:output id="theme-opacity-output">72%</html:output></html:span><html:input id="theme-opacity" type="range" min="18" max="100" value="72"/></html:label><html:label class="theme-range"><html:span><html:span><html:strong>质感</html:strong><html:small>背景的细微颗粒</html:small></html:span><html:output id="theme-texture-output">18%</html:output></html:span><html:input id="theme-texture" type="range" min="0" max="100" value="18"/></html:label></html:section>
</vbox>
