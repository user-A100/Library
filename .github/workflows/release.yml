name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  desktop-bundles:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: "--target aarch64-apple-darwin"
          - os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - name: Frontend dependencies
        working-directory: apps/library-workbench
        run: pnpm install --frozen-lockfile
      - name: Build desktop bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/library-workbench
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: "Library ${{ github.ref_name }}"
          releaseBody: "See the assets below for this release."
          releaseDraft: false
          prerelease: false

  cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: tar.gz
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build CLI
        working-directory: apps/library-workbench/cli
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package (tar.gz)
        if: matrix.ext == 'tar.gz'
        working-directory: apps/library-workbench/target/${{ matrix.target }}/release
        run: |
          tar czf library-cli-${{ github.ref_name }}-${{ matrix.target }}.tar.gz library-cli
          sha256sum library-cli-${{ github.ref_name }}-${{ matrix.target }}.tar.gz > library-cli-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256
      - name: Package (zip)
        if: matrix.ext == 'zip'
        working-directory: apps/library-workbench/target/${{ matrix.target }}/release
        shell: pwsh
        run: |
          Compress-Archive -Path library-cli.exe -Destination library-cli-${{ github.ref_name }}-${{ matrix.target }}.zip
          (Get-FileHash library-cli-${{ github.ref_name }}-${{ matrix.target }}.zip -Algorithm SHA256).Hash.ToLower() + "  library-cli-${{ github.ref_name }}-${{ matrix.target }}.zip" | Out-File -Encoding ascii library-cli-${{ github.ref_name }}-${{ matrix.target }}.zip.sha256
      - name: Locate archives
        id: loc
        shell: bash
        run: |
          ROOT=apps/library-workbench/target/${{ matrix.target }}/release
          [ -d "$ROOT" ] || ROOT=apps/library-workbench/cli/target/${{ matrix.target }}/release
          echo "dir=$ROOT" >> "$GITHUB_OUTPUT"
      - name: Upload CLI archives
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            ${{ steps.loc.outputs.dir }}/library-cli-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.ext }}
            ${{ steps.loc.outputs.dir }}/library-cli-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.ext }}.sha256
